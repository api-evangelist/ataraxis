aid: ataraxis
name: Ataraxis
description: >-
  Ataraxis AI is a precision-medicine company building clinical AI foundation
  models that make disease predictable, beginning with oncology. Founded in 2022
  by Jan Witowski, MD, PhD, and Krzysztof Geras, PhD (both formerly of NYU),
  Ataraxis trains multi-modal AI on hundreds of millions of pathology images to
  assess disease aggressiveness and predict cancer recurrence, treatment
  response, and survival. Its first product, Ataraxis Breast, is an AI-native,
  clinically validated prognostic and predictive test suite for breast cancer
  (Recurrence Risk, Chemotherapy Benefit, and Neoadjuvant Response) delivering
  same-day results without exhausting physical tissue. The company is backed by
  Obvious Ventures, AIX Ventures, and Giant Ventures, and advised by Turing
  Award winner Yann LeCun. Ataraxis operates a clinician portal rather than a
  public developer API; this profile captures its public identity, legal, and
  security surface for the API Evangelist network.
